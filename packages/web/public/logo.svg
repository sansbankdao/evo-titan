<svg
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 128 128"
    role="img"
    aria-label="Evo Titan"
>
    <!--
      Evo Titan mark — a Titan's monogram: a pillar of light splitting an
      interlocking T, framed by a laurel-less crown of concentric arcs.
      Pure geometry, no third-party assets. Scalable to any size.
    -->
    <defs>
        <linearGradient id="titanGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#4f46e5" />
        </linearGradient>
    </defs>

    <!-- Outer vault: the "umbrella" over many nodes. -->
    <path
        d="M24 96V56a40 40 0 0 1 80 0v40"
        stroke="url(#titanGradient)"
        stroke-width="8"
        stroke-linecap="round"
    />

    <!-- The central T: vertical power, horizontal reach. -->
    <path d="M46 46h36" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
    <path d="M64 46v44" stroke="url(#titanGradient)" stroke-width="8" stroke-linecap="round" />

    <!-- Nodes gathered under the umbrella. -->
    <circle cx="34" cy="104" r="6" fill="#818cf8" />
    <circle cx="64" cy="104" r="6" fill="#e2e8f0" />
    <circle cx="94" cy="104" r="6" fill="#818cf8" />
</svg>
