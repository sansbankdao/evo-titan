[package]
name = "evo-titan"
version = "26.9.25"
description = "Evo Titan desktop application"
authors = ["Sansbank contributors <hello@sansbank.org>"]
license = ""
repository = "https://github.com/sansbankdao/evo-titan"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "evo_titan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde_json = "=1.0.145"
serde = { version = "=1.0.228", features = ["derive"] }
log = "=0.4.28"
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-log = "=2.8.0"
