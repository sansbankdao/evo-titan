[package]
name = "evo-titan"
version = "26.9.26"
description = "Evo Titan desktop application"
authors = ["Sansbank contributors <hello@sansbank.org>"]
license = ""
repository = "https://github.com/sansbankdao/evo-titan"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "evo_titan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde_json = "=1.0.145"
serde = { version = "=1.0.228", features = ["derive"] }
log = "=0.4.28"
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-log = "=2.8.0"
# The RPC transport. Pinned to the version already present in Cargo.lock as a
# transitive dependency (0.13.5), so this adds no new crate to the tree.
# Needed because dashd sends no CORS headers and 501s an OPTIONS preflight, so
# the webview cannot reach the node directly. See src/rpc.rs.
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
# Local SQLite cache for contested DPNS names. See src/cache.rs for why this is
# rusqlite rather than tauri-plugin-sql, and why `bundled` is required.
# `functions` and `fallible_uint` are off: neither is used, and leaving them off
# keeps the compiled footprint to just SQLite itself.
rusqlite = { version = "=0.38.0", default-features = false, features = ["bundled"] }
